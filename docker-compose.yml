# Mappe – App und Datenbank.
# Start:  cp .env.example .env  &&  docker compose up -d
#
# Läuft auf Synology, Unraid, Mac mini oder jedem anderen Docker-Host.
#
# Wo die Daten liegen, entscheidet die .env. Ohne Angabe nimmt Compose die
# beiden benannten Volumes unten – das ist der bequeme Weg und funktioniert
# überall. Steht dort ein Pfad, wird daraus ein Bind-Mount auf genau dieses
# Verzeichnis; beides schreibt sich in derselben Zeile, weil Docker einen
# absoluten Pfad von einem Volume-Namen selbst unterscheidet.
#
# Auf Unraid gehört hier ein Pfad hin. Ein benanntes Volume landet sonst im
# docker.img, und das hat drei unangenehme Folgen: Das appdata-Backup erfasst
# die Daten nicht, das Abbild ist knapp bemessen, und läuft es voll, fallen
# alle anderen Container auf demselben Host mit um.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mappe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt in der .env}
      POSTGRES_DB: ${POSTGRES_DB:-mappe}
      # Sonst legt Postgres die Sortierung nach der Locale des Hosts fest und
      # ein Umzug auf einen anderen Server bricht die Indizes.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    volumes:
      - ${DB_DIR:-db-daten}:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-mappe} -d ${POSTGRES_DB:-mappe}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mappe}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-mappe}?schema=public
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET fehlt in der .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY fehlt in der .env}
      APP_URL: ${APP_URL:-http://localhost:4300}
      STORAGE_DIR: /data/storage
      # Im Container lauscht die Anwendung immer auf 3000. Nach außen sichtbar
      # ist nur MAPPE_PORT – so bleibt das Abbild unabhängig davon, welcher
      # Port auf dem jeweiligen Server noch frei ist.
      PORT: 3000
      NODE_ENV: production
      TZ: ${TZ:-Europe/Berlin}
    ports:
      - '${MAPPE_PORT:-4300}:3000'
    # Vorgabe ist Docker's eigener Auflöser – also alles wie gehabt. Ein
    # anderer Wert wird nötig, wenn der Docker-Host seine Namensauflösung über
    # ein VPN schickt: Tailscale etwa liefert für manche Namen nur IPv6, und
    # ein Container ohne IPv6-Weg nach draußen scheitert dann mit ENETUNREACH.
    # Betroffen war bei uns ausgerechnet der Microsoft-Login – wechselhaft,
    # weil andere Namen weiterhin IPv4 zurückgaben.
    dns: ${MAPPE_DNS:-127.0.0.11}
    volumes:
      - ${DOKUMENTE_DIR:-dokumente}:/data/storage

# Werden nur angelegt, wenn DB_DIR bzw. DOKUMENTE_DIR leer bleiben.
volumes:
  db-daten:
  dokumente:
